<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solis Creek PD — Database Login</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f0f0ee; font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow: hidden; }
  .card { background: white; border: 1px solid #ccc; width: 100%; max-width: 380px; z-index: 10; }
  .card-header { background: #1a2535; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  .card-header .card-emblem { width: 54px; height: 54px; object-fit: contain; display: block; }
  .dept-name { font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #d4b96a; }
  .dept-sub { font-size: 10px; color: #7a8a9a; letter-spacing: 0.06em; margin-top: 2px; }
  .card-body { padding: 28px 24px; }
  .form-title { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #555; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #e8e8e8; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 11px; font-weight: 600; color: #555; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 5px; }
  input[type="text"], input[type="password"] { width: 100%; padding: 9px 12px; border: 1px solid #bbb; background: #fafafa; font-family: 'Source Code Pro', monospace; font-size: 13px; color: #222; outline: none; transition: border-color 0.15s; }
  input:focus { border-color: #1a2535; background: white; }
  .login-btn { width: 100%; margin-top: 18px; padding: 10px; background: #1a2535; color: #d4b96a; border: none; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; transition: background 0.15s; }
  .login-btn:hover { background: #243246; }
  .login-btn:disabled { opacity: 0.6; cursor: default; }
  .error-msg { font-family: 'Source Code Pro', monospace; font-size: 11px; color: #b03a2e; margin-top: 10px; min-height: 16px; opacity: 0; transition: opacity 0.2s; }
  .error-msg.show { opacity: 1; }
  .card-footer { border-top: 1px solid #e8e8e8; padding: 9px 24px; display: flex; justify-content: space-between; align-items: center; background: #fafafa; }
  .status-text { font-family: 'Source Code Pro', monospace; font-size: 9px; color: #aaa; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #4caf50; animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Helper Overlay Styles */
  .helper-wrapper {
    position: fixed;
    bottom: -350px;
    right: 30px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    transition: bottom 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 1000;
  }
  .helper-wrapper.active { bottom: 20px; }
  
  .speech-bubble {
    background: url('images/speechbubble.png') no-repeat center center;
    background-size: 100% 100%;
    padding: 30px 40px 60px 30px; 
    font-size: 14px;
    font-weight: 600;
    font-family: "Comic Sans MS", "Comic Sans", cursive; 
    color: #333;
    max-width: 260px;
    min-height: 140px;
    margin-bottom: -10px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    z-index: 2;
  }
  
  .helper-character {
    width: 140px; 
    height: auto;
    z-index: 1;
    pointer-events: none;
  }
  
  .back-btn {
    display: none;
    margin-top: 10px;
    padding: 12px 24px;
    background: #b03a2e;
    color: white;
    text-decoration: none;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    border-radius: 4px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }
  .back-btn.show { display: inline-block; }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <img class="card-emblem" src="images/soliscreekpolicelogo.png" width="54" height="54" alt="Department emblem">
    <div>
      <div class="dept-name">Solis Creek Police Dept.</div>
      <div class="dept-sub">Records &amp; Data Division — Secure Access</div>
    </div>
  </div>

  <div class="card-body">
    <div class="form-title">Personnel Login</div>
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <div id="error-msg" class="error-msg">ACCESS DENIED — Invalid credentials</div>
    <button class="login-btn" id="login-btn">Log In</button>
  </div>

  <div class="card-footer">
    <span class="status-text" id="clock">00:00:00</span>
    <div class="status-dot"></div>
  </div>
</div>

<div class="helper-wrapper" id="helper">
  <div class="speech-bubble" onclick="advanceDialogue()">
    <span id="helper-bubble-text">Uh oh! Looks like you don't have the right credentials.</span>
  </div>
  <img src="images/sunny-base.gif" class="helper-character" id="sunny-sprite" alt="Sunny the Helper">
  <a href="homepage.html" class="back-btn" id="helper-back">Back to Homepage</a>
</div>

<script>
  setInterval(() => {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US',{hour12:false});
  }, 1000);

  const dialogueLines = [
    "Uh oh! Looks like you don't have the right credentials.",
    "This database is highly restricted. Only authorized personnel are allowed!",
    "If you lost your login, maybe the public pages have some clues hidden around...",
    "Try heading back to the Homepage or the About page."
  ];
  let dialogueIndex = 0;

  window.triggerHelper = function() {
    document.getElementById('helper').classList.add('active');
  };

  function advanceDialogue() {
    dialogueIndex++;
    if (dialogueIndex < dialogueLines.length) {
      document.getElementById('helper-bubble-text').innerHTML = dialogueLines[dialogueIndex];
    } else {
      document.querySelector('.speech-bubble').style.display = 'none';
      document.getElementById('helper-back').classList.add('show');
      // Optional: Swap Sunny to an idle frame when talking is done
      // document.getElementById('sunny-sprite').src = "images/sunny-idle1.png"; 
    }
  }

  const urlState = new URLSearchParams(location.search).get('state');

  if (urlState === 'sinister') {
    // Post-ARG page alterations
    document.body.style.background = '#0a0a0a';
    document.querySelector('.card').style.borderColor = '#2a0a0a';
    document.querySelector('.card').style.boxShadow = '0 0 40px rgba(176,58,46,0.3)';
    document.querySelector('.form-title').textContent = 'Nobody will believe you.';
    document.querySelector('.dept-sub').textContent = 'what you saw cannot be unseen';
    document.querySelector('.dept-name').style.color = '#b03a2e';
    document.querySelector('.status-dot').style.background = '#b03a2e';
    document.querySelector('.login-btn').style.background = '#3a0a0a';
    document.querySelector('.login-btn').style.color = '#b03a2e';
    document.getElementById('username').placeholder = "it doesn't matter";
    const emblem = document.querySelector('.card-emblem');
    if (emblem) emblem.style.filter = 'hue-rotate(180deg) saturate(3) brightness(0.5)';

    // Trigger evil Sunny after a short delay
    setTimeout(() => {
      document.getElementById('helper').classList.add('active');
      startEvilDialogue();
    }, 1800);
  }

  // Evil Sunny dialogue sequence for sinister state
  const evilDialogueLines = [
    "You found it.",
    "The file. The truth underneath the flyer.",
    "Now you know what's in the basement.",
    "You know what they did on Vine Street.",
    "Go ahead. Tell someone.",
    "Nobody will believe you.",
    "They never do.",
    "Welcome back to the department website.",
    "Have a nice day. :)"
  ];
  let evilDialogueIndex = 0;
  let evilDone = false;

  function startEvilDialogue() {
    const bubble = document.querySelector('.speech-bubble');
    const sprite = document.getElementById('sunny-sprite');
    const backBtn = document.getElementById('helper-back');

    sprite.src = 'images/sunny-evil.gif';
    sprite.style.filter = '';
    bubble.style.color = '#b03a2e';
    bubble.style.cursor = 'pointer';
    document.getElementById('helper-bubble-text').textContent = evilDialogueLines[0];

    bubble.onclick = function () {
      evilDialogueIndex++;
      if (evilDialogueIndex < evilDialogueLines.length) {
        document.getElementById('helper-bubble-text').textContent = evilDialogueLines[evilDialogueIndex];
      } else if (!evilDone) {
        evilDone = true;
        bubble.style.display = 'none';
        backBtn.classList.add('show');
        backBtn.textContent = 'Return to the Homepage';
        backBtn.style.background = '#1a0505';
        backBtn.style.color = '#b03a2e';
        backBtn.style.border = '1px solid #b03a2e';
      }
    };
  }
</script>
<script src="login-api.js"></script>
</body>
</html>
