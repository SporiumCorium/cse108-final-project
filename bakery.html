<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Rise Bakery</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { 
    background: #111; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    margin: 0; 
    overflow: hidden;
  }
  
  .puzzle-container { 
    position: relative; 
    width: 600px; 
    height: 800px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
  }
  
  .puzzle-layer {
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%;
    object-fit: contain;
  }

  /* The terrifying layer underneath (Z-index 1) */
  #underneath { z-index: 1; }
  
  /* The Fake Flyer covering it (Z-index 2) */
  #bakery-flyer { z-index: 2; }
  
  .meta-hint {
    position: absolute;
    bottom: -30px;
    width: 100%;
    text-align: center;
    color: #444;
    font-family: 'Source Code Pro', monospace;
    font-size: 10px;
    z-index: 3;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="puzzle-container">
  <img src="images/underneath.png" id="underneath" class="puzzle-layer" alt="They are hiding the truth">

  <img src="images/bakeryflyer.png" id="bakery-flyer" class="puzzle-layer" alt="Golden Rise Bakery Flyer">
  
  <div class="meta-hint">Something is hiding behind this element. Check your Developer Tools.</div>
</div>

<script src="interaction-tracking.js" data-track-page="bakery"></script>
</body>
</html>
